services:
  - type: web
    name: teamspace-saas-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn --chdir src config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_NAME
        value: postgres
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: DJANGO_DEBUG
        value: "False"
      - key: REFRESH_COOKIE_SECURE
        value: "True"
      - key: TRUST_PROXY_HTTPS
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"