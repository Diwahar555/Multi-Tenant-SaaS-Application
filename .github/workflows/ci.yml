name: TeamSpace MySQL and React checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y mysql-server default-libmysqlclient-dev pkg-config
      - run: |
          sudo service mysql start
          sudo mysql -e "CREATE DATABASE teamspace CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          sudo mysql -e "CREATE USER 'teamspace_user'@'127.0.0.1' IDENTIFIED BY 'test-password';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON *.* TO 'teamspace_user'@'127.0.0.1';"
      - run: pip install -r backend/requirements.txt
      - run: python manage.py check && python manage.py makemigrations --check --dry-run && pytest -q
        working-directory: backend
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: test-only-key-not-for-production
          DB_NAME: teamspace
          DB_USER: teamspace_user
          DB_PASSWORD: test-password
          DB_HOST: '127.0.0.1'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
